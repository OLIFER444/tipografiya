<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Новокосино</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="../icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Новокосино">
  <meta name="theme-color" content="#000000">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe id="app" allow="fullscreen"></iframe>
  <script>
    // Офис зашит в страницу: у каждого свой start_url, установленное
    // приложение всегда открывает свой офис (см. ../README.md).
    var BASE = 'https://script.google.com/macros/s/AKfycbyg3Hkp5Srt-kQCNrqAjWIkpmSl0Ep1yqm3fsG3ikSoAodGkrbRq8Nd0LBZKe6mMOCI/exec';
    document.getElementById('app').src = BASE + '?app=nk';
  </script>
</body>
</html>
